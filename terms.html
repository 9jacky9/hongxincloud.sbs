<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服务条款</title>
  <style>
    :root { --space-bg: #0B0F19; --silver: #E2E8F0; --accent-blue: #38BDF8; --red-apricot: #FF4081; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--space-bg); color: var(--silver); margin: 0; padding: 0; line-height: 1.6; overflow-x: hidden; }
    
    header { position: fixed; top: 0; width: 100%; padding: 15px 5vw; box-sizing: border-box; z-index: 100; display: flex; justify-content: space-between; align-items: center; background: rgba(11,15,25,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
    .logo { font-size: 1.5rem; font-weight: 300; letter-spacing: 3px; display: flex; align-items: center; gap: 12px; color: #FFF; }
    .logo svg { width: 35px; height: 35px; }
    
    .header-nav { display: flex; align-items: center; gap: 30px; }
    .nav-links { display: flex; gap: 30px; align-items: center; }
    .nav-links a { color: var(--silver); text-decoration: none; font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; transition: color 0.3s; }
    .nav-links a:hover { color: var(--accent-blue); text-shadow: 0 0 10px rgba(56,189,248,0.5); }
    
    .sci-btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 25px; background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue); font-size: 1rem; letter-spacing: 1px; text-decoration: none; text-transform: uppercase; transition: all 0.3s; position: relative; overflow: hidden; cursor: pointer; }
    .sci-btn::before { content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(56,189,248,0.2), transparent); transition: 0.5s; }
    .sci-btn:hover::before { left: 100%; }
    .sci-btn:hover { background: rgba(56,189,248,0.1); box-shadow: 0 0 15px rgba(56,189,248,0.3); }
    .btn-red { border-color: var(--red-apricot); color: var(--red-apricot); }
    .btn-red:hover { background: rgba(255,64,129,0.1); box-shadow: 0 0 15px rgba(255,64,129,0.3); }
    .btn-red::before { background: linear-gradient(90deg, transparent, rgba(255,64,129,0.2), transparent); }
    
    .container { max-width: 1200px; margin: 0 auto; padding: 120px 20px 40px; }
    
    h1, h2 { font-weight: 300; letter-spacing: 2px; color: #FFF; }
    h1 { font-size: 3.5rem; margin-bottom: 20px; }
    h1 span { color: var(--red-apricot); text-shadow: 0 0 10px rgba(255,64,129,0.5); }
    .section-title { text-align: center; margin-bottom: 50px; font-size: 2.5rem; scroll-margin-top: 100px; padding-top: 60px; }
    
    .grid-hub { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-bottom: 80px; }
    .hub-card { border: 1px solid rgba(255,255,255,0.1); padding: 30px; background: rgba(255,255,255,0.02); transition: all 0.3s; display: flex; flex-direction: column; }
    .hub-card:hover { border-color: var(--accent-blue); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .hub-card h3 { color: #FFF; font-weight: 400; font-size: 1.3rem; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
    
    .pricing-table { display: flex; width: 100%; gap: 20px; margin-bottom: 80px; }
    .price-col { flex: 1; border: 1px solid rgba(255,255,255,0.1); padding: 40px 20px; text-align: center; display: flex; flex-direction: column; }
    .price-col.active { border-color: var(--red-apricot); box-shadow: 0 0 20px rgba(255,64,129,0.1); position: relative; }
    .p-val { font-size: 3rem; color: #FFF; margin: 20px 0; font-weight: 200; line-height: 1; }
    .p-val span { font-size: 1rem; color: var(--silver); }
    
    ul.sci-list { list-style: none; padding: 0; text-align: left; margin-bottom: 30px; flex-grow: 1; }
    ul.sci-list li { margin-bottom: 12px; font-size: 0.95rem; display: flex; align-items: center; }
    ul.sci-list li::before { content: ""; display: inline-block; width: 6px; height: 6px; background: var(--accent-blue); border-radius: 50%; margin-right: 15px; flex-shrink: 0; }
    
    .faq-item { border-left: 2px solid var(--accent-blue); padding-left: 20px; margin-bottom: 30px; }
    .faq-item h3 { margin-top: 0; font-size: 1.2rem; margin-bottom: 10px; }
    .testi-card { border: 1px solid rgba(255,255,255,0.05); padding: 30px; font-style: italic; position: relative; background: rgba(0,0,0,0.2); }
    .testi-author { text-align: right; margin-top: 15px; color: var(--accent-blue); font-weight: 300; font-style: normal; }
    
    .footer-area { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 40px; margin-top: 60px; text-align: center; font-size: 0.9rem; }
    .footer-area a { color: var(--silver); margin: 0 15px; text-decoration: none; transition: 0.3s; }
    .footer-area a:hover { color: #FFF; text-shadow: 0 0 5px #FFF; }
    
    /* Background grid effect */
    .bg-grid { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 50px 50px; z-index: -1; pointer-events: none; }
    
    @media (max-width: 900px) {
      .pricing-table { flex-direction: column; }
      .nav-links { display: none; }
      h1 { font-size: 2.5rem; }
    }
  

    /* SEO Links Customization */
    .seo-content a { color: var(--accent-blue) !important; text-decoration: none; font-weight: bold; transition: opacity 0.3s; }
    .seo-content a:visited { color: var(--accent-blue) !important; }
    .seo-content a:hover { opacity: 0.7; }
    .seo-content h1, .seo-content h2, .seo-content h3 { margin-top: 1.5em; margin-bottom: 0.5em; }
    .seo-content p { margin-bottom: 1.5em; font-size: 1.1rem; line-height: 1.8; }
    .seo-content ul { margin-bottom: 1.5em; line-height: 1.8; font-size: 1.1rem; }
    </style>
</head>

  </header>
  <div class="container hub-card" style="margin-top: 120px; margin-bottom: 80px; max-width: 900px; background: rgba(11,15,25,0.9); backdrop-filter: blur(10px);">

  </div>
</body>
</html>
